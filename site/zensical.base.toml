[project]
site_name = "Garage provider for OpenTofu and Terraform"
site_description = "Manage Garage object storage as code: buckets, website hosting, CORS and lifecycle rules, access keys, permissions, admin tokens and the cluster layout."
site_url = "https://mathieuha.github.io/terraform-provider-garage/"
repo_url = "https://github.com/mathieuHa/terraform-provider-garage"
repo_name = "mathieuHa/terraform-provider-garage"
copyright = "Provider licensed under the Apache License 2.0. Garage is developed by Deuxfleurs."

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-7"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-4"
toggle.name = "Light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.check_paths = true
